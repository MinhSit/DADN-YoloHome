spring.application.name=backend

# ==== Database (Postgres) ====
# Set qua bien moi truong khi deploy, vi du:
#   DB_HOST=xxx.supabase.co DB_PORT=5432 DB_NAME=postgres DB_USER=postgres DB_PASSWORD=xxx DB_SSLMODE=require
# Local dev mac dinh tro ve localhost/yolohome (giong pgAdmin hien tai).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yolohome}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Khong de Hibernate tu sinh/sua schema - table da duoc Python/MQTT dung, tranh xung dot
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ==== Server ====
server.port=${PORT:8080}

# ==== CORS (cho frontend web app goi API) ====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==== MQTT (dung de publish lenh dieu khien LED/Fan xuong Yolo:Bit) ====
# Vi du HiveMQ Cloud: broker-uri=ssl://xxxxx.s1.eu.hivemq.cloud:8883
mqtt.broker-uri=${MQTT_BROKER_URI:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:yolohome-backend}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
# Topic pattern de publish lenh, {deviceId} se duoc thay the luc runtime
mqtt.command-topic-pattern=${MQTT_COMMAND_TOPIC_PATTERN:yolohome/{deviceId}/command}
mqtt.config-topic-pattern=${MQTT_CONFIG_TOPIC_PATTERN:yolohome/{deviceId}/config}
mqtt.manual-topic-pattern=${MQTT_MANUAL_TOPIC_PATTERN:yolohome/{deviceId}/manual}
mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:10}

# ==== JWT ====
# QUAN TRONG: JWT_SECRET phai duoc set qua bien moi truong that khi deploy,
# gia tri mac dinh duoi day CHI danh cho dev local, khong dung cho production.
jwt.secret=${JWT_SECRET:yolohome-dev-secret-key-change-me-before-deploy-32chars}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}

# ==== Alert thresholds mac dinh (dung khi app_settings chua co du lieu) ====
app.alerts.default-temperature-threshold=${DEFAULT_TEMP_THRESHOLD:30}
app.alerts.default-humidity-threshold=${DEFAULT_HUMIDITY_THRESHOLD:70}
